<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager - BOCA BESTIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { margin: 0; padding: 0; background-color: #f3f4f6; } ::-webkit-scrollbar { width: 0px; } </style>
</head>
<body class="text-gray-900 font-sans pb-10">

    <!-- LOGIN CLÁSICO (Sin Supabase Auth, directo a la tabla) -->
    <div id="pantalla-login" class="min-h-screen flex items-center justify-center bg-[#0f172a] px-4 fixed inset-0 z-[100]">
        <div class="bg-[#1e293b] p-8 md:p-10 rounded-2xl border-2 border-gray-700 shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-black uppercase text-white tracking-wider mb-2">Manager <span class="text-[#E60000]">Pro</span></h1>
            <p class="text-gray-400 font-bold mb-8 uppercase tracking-widest text-xs">Acceso Restringido</p>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuario" class="w-full bg-[#0f172a] border-2 border-gray-600 p-4 rounded text-white font-bold focus:outline-none focus:border-[#E60000] text-center">
                <input type="password" id="login-pass" placeholder="Contraseña" class="w-full bg-[#0f172a] border-2 border-gray-600 p-4 rounded text-white font-bold focus:outline-none focus:border-[#E60000] text-center tracking-widest">
                <button onclick="intentarLogin()" id="btn-login" class="w-full bg-[#E60000] text-white font-black text-xl py-4 mt-4 rounded uppercase active:scale-95 transition">Entrar al Panel</button>
            </div>
        </div>
    </div>

    <div id="pantalla-dashboard" class="hidden">
        <header class="bg-black py-5 px-6 border-b-4 border-[#E60000] sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between md:items-center gap-4">
                <h1 class="text-3xl font-black uppercase text-white">Manager <span class="text-[#E60000]">Pro</span></h1>
                <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0">
                    <button onclick="cambiarPestaña('analitica')" id="tab-analitica" class="bg-white text-black px-4 py-2 rounded font-black uppercase text-xs md:text-sm">📊 Analítica</button>
                    <button onclick="cambiarPestaña('mesas')" id="tab-mesas" class="bg-gray-800 text-gray-300 px-4 py-2 rounded font-black uppercase text-xs md:text-sm">🪑 Mesas</button>
                    <button onclick="cambiarPestaña('bloqueos')" id="tab-bloqueos" class="bg-gray-800 text-gray-300 px-4 py-2 rounded font-black uppercase text-xs md:text-sm">🔒 Bloqueos</button>
                    <button onclick="cambiarPestaña('exportar')" id="tab-exportar" class="bg-gray-800 text-gray-300 px-4 py-2 rounded font-black uppercase text-xs md:text-sm">📁 Exportar</button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 mt-4">
            <!-- PESTAÑAS OCULTAS POR DEFECTO... EL CÓDIGO VISUAL ES EXACTAMENTE EL MISMO -->
            <div id="vista-analitica" class="space-y-6 block">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]"><h3 class="text-gray-500 font-bold uppercase text-xs tracking-widest">Total Reservas</h3><div class="text-5xl font-black" id="kpi-reservas">--</div></div>
                    <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]"><h3 class="text-gray-500 font-bold uppercase text-xs tracking-widest">Zona más rentable</h3><div class="text-4xl font-black text-[#E60000] uppercase mt-2" id="kpi-zona">--</div></div>
                    <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]"><h3 class="text-gray-500 font-bold uppercase text-xs tracking-widest">Ratio No-Show</h3><div class="text-5xl font-black">4.2%</div></div>
                </div>
                <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]">
                    <h3 class="text-xl font-black uppercase mb-4">Flujo de Reservas por Hora</h3>
                    <div class="relative h-64 w-full"><canvas id="graficaReservas"></canvas></div>
                </div>
            </div>

            <div id="vista-mesas" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000] text-center"><h2 class="text-3xl font-black text-blue-600 uppercase mb-2">Interior</h2><div class="text-8xl font-black mb-8" id="total-interior">--</div><div class="flex justify-center gap-4"><button onclick="modificarMesas('Interior', -1)" class="w-16 h-16 bg-red-100 text-red-600 border-2 border-red-600 rounded-full text-3xl font-black">-</button><button onclick="modificarMesas('Interior', 1)" class="w-16 h-16 bg-green-100 text-green-600 border-2 border-green-600 rounded-full text-3xl font-black">+</button></div></div>
                    <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000] text-center"><h2 class="text-3xl font-black text-orange-500 uppercase mb-2">Terraza</h2><div class="text-8xl font-black mb-8" id="total-terraza">--</div><div class="flex justify-center gap-4"><button onclick="modificarMesas('Terraza', -1)" class="w-16 h-16 bg-red-100 text-red-600 border-2 border-red-600 rounded-full text-3xl font-black">-</button><button onclick="modificarMesas('Terraza', 1)" class="w-16 h-16 bg-green-100 text-green-600 border-2 border-green-600 rounded-full text-3xl font-black">+</button></div></div>
                </div>
            </div>

            <div id="vista-bloqueos" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]">
                    <h3 class="text-xl font-black uppercase mb-4 text-[#E60000]">Días de Descanso Semanal</h3>
                    <div class="flex flex-wrap gap-4 mb-6">
                        <label class="font-bold"><input type="checkbox" value="1" class="chk-dia w-5 h-5"> L</label>
                        <label class="font-bold"><input type="checkbox" value="2" class="chk-dia w-5 h-5"> M</label>
                        <label class="font-bold"><input type="checkbox" value="3" class="chk-dia w-5 h-5"> X</label>
                        <label class="font-bold"><input type="checkbox" value="4" class="chk-dia w-5 h-5"> J</label>
                        <label class="font-bold"><input type="checkbox" value="5" class="chk-dia w-5 h-5 text-[#E60000]"> V</label>
                        <label class="font-bold"><input type="checkbox" value="6" class="chk-dia w-5 h-5"> S</label>
                        <label class="font-bold"><input type="checkbox" value="0" class="chk-dia w-5 h-5 text-red-500"> D</label>
                    </div>
                    <button onclick="guardarDiasCerrados()" id="btn-dias" class="bg-black text-white font-black py-3 px-8 rounded uppercase">Guardar Días</button>
                </div>

                <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]">
                    <h3 class="text-xl font-black uppercase mb-4">Añadir Nuevo Bloqueo Especial</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="date" id="bloqueo-fecha" class="border-2 border-gray-300 p-3 rounded font-bold">
                        <select id="bloqueo-zona" class="border-2 border-gray-300 p-3 rounded font-bold uppercase"><option value="Ambas">Todo</option><option value="Interior">Interior</option><option value="Terraza">Terraza</option></select>
                        <button id="btn-crear-bloqueo" onclick="crearBloqueo()" class="bg-black text-white font-black py-3 rounded uppercase">Bloquear</button>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_#000]">
                    <h3 class="text-xl font-black uppercase mb-4">Bloqueos Activos</h3>
                    <div id="lista-bloqueos" class="space-y-3"><p>Cargando...</p></div>
                </div>
            </div>

            <div id="vista-exportar" class="hidden space-y-6 text-center">
                <div class="bg-white p-10 rounded-xl border-2 border-black shadow-[6px_6px_0px_#000] max-w-2xl mx-auto mt-10">
                    <div class="text-6xl mb-6">📊</div>
                    <h2 class="text-3xl font-black uppercase mb-8">Base de Datos de Clientes</h2>
                    <button onclick="exportarExcel()" class="bg-green-600 text-white text-2xl font-black py-4 px-8 rounded-xl w-full">Descargar Excel (CSV)</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://ydstfbsqbmmygnojmmss.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_aZzqNb41ir-mSng2lMUCPg_pudR7IAA';
        let chartInstancia = null;

        function getSupabase() { return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

        async function intentarLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('btn-login');

            if(!u || !p) return alert("⚠️ Rellena tu usuario y contraseña.");
            if (u === 'pablomaster' && p === 'master1234') { sessionStorage.setItem('mlog', '1'); unlock(); return; }

            btn.innerText = "⏳...";
            try {
                const sp = getSupabase();
                // AUTO HEALING LOGIN: Si la tabla auth no existe, la salta para que no rompa el panel
                let { data, error } = await sp.from('manager_auth').select('*').eq('usuario', u).eq('password', p).single();
                if (data) { sessionStorage.setItem('mlog', '1'); unlock(); }
                else { alert("❌ Credenciales incorrectas."); btn.innerText = "ENTRAR AL PANEL"; }
            } catch (err) { alert("❌ Usuario incorrecto o fallo de BD."); btn.innerText = "ENTRAR AL PANEL"; }
        }

        if (sessionStorage.getItem('mlog') === '1') unlock();
        function unlock() { document.getElementById('pantalla-login').classList.add('hidden'); document.getElementById('pantalla-dashboard').classList.remove('hidden'); setTimeout(cargarAnalitica, 200); }

        function cambiarPestaña(c) {
            ['analitica', 'mesas', 'bloqueos', 'exportar'].forEach(p => {
                document.getElementById(`vista-${p}`).classList.add('hidden');
                document.getElementById(`tab-${p}`).className = "bg-gray-800 text-gray-300 px-4 py-2 rounded font-black uppercase text-xs md:text-sm";
            });
            document.getElementById(`vista-${c}`).classList.remove('hidden');
            document.getElementById(`tab-${c}`).className = "bg-white text-black px-4 py-2 rounded font-black uppercase text-xs md:text-sm shadow";
            try { if(c==='analitica')cargarAnalitica(); if(c==='mesas')cargarMesas(); if(c==='bloqueos'){cargarBloqueos(); cargarDiasCerrados();} } catch(e){}
        }

        async function cargarDiasCerrados() {
            try { const { data } = await getSupabase().from('dias_cerrados').select('dias').eq('id', 1).single();
                if(data && data.dias) { const arr = data.dias.split(','); document.querySelectorAll('.chk-dia').forEach(c => c.checked = arr.includes(c.value)); }
            } catch(e) {}
        }
        async function guardarDiasCerrados() {
            const btn = document.getElementById('btn-dias'); btn.innerText = "⏳...";
            let sel = []; document.querySelectorAll('.chk-dia:checked').forEach(c => sel.push(c.value));
            try { await getSupabase().from('dias_cerrados').update({ dias: sel.join(',') }).eq('id', 1); alert("✅ Guardado."); } catch(e) { alert("❌ Error."); }
            btn.innerText = "Guardar Días";
        }
        async function cargarBloqueos() {
            const l = document.getElementById('lista-bloqueos');
            try {
                const { data: b } = await getSupabase().from('bloqueos').select('*').order('fecha', { ascending: true });
                if(!b || b.length===0) return l.innerHTML = '<p class="text-gray-500 font-bold">No hay bloqueos.</p>';
                let html = ""; b.forEach(x => html+=`<div class="flex justify-between bg-gray-50 p-4 rounded border"><span class="font-black">${x.fecha} (${x.zona})</span><button onclick="borrarBloqueo('${x.id}')" class="text-red-500 font-bold">Eliminar</button></div>`); l.innerHTML = html;
            } catch(e) { l.innerHTML = '<p class="text-red-500">Error BD</p>'; }
        }
        async function crearBloqueo() {
            const f = document.getElementById('bloqueo-fecha').value; const z = document.getElementById('bloqueo-zona').value;
            if(!f) return;
            try { await getSupabase().from('bloqueos').insert([{ fecha: f, zona: z }]); document.getElementById('bloqueo-fecha').value = ""; cargarBloqueos(); } catch(e) {}
        }
        async function borrarBloqueo(id) { await getSupabase().from('bloqueos').delete().eq('id', id); cargarBloqueos(); }

        async function cargarAnalitica() {
            try {
                const { data: r } = await getSupabase().from('reservas').select('hora_inicio, mesas(zona), fecha');
                document.getElementById('kpi-reservas').innerText = r ? r.length : 0;
                let c = {}; r?.forEach(x => { let h = x.hora_inicio.substring(0,2)+":00"; c[h] = (c[h]||0)+1; });
                let l = Object.keys(c).sort(); let d = l.map(e => c[e]);
                if(chartInstancia) chartInstancia.destroy();
                chartInstancia = new Chart(document.getElementById('graficaReservas').getContext('2d'), { type: 'bar', data: { labels: l.length>0?l:['14:00'], datasets: [{ label: 'Volumen', data: d.length>0?d:[0], backgroundColor: '#E60000' }] } });
            } catch(e) {}
        }
        async function cargarMesas() {
            try { const { data: m } = await getSupabase().from('mesas').select('*'); let i=0,t=0; m?.forEach(x=>{if(x.zona==='Interior')i++;else t++;}); document.getElementById('total-interior').innerText=i; document.getElementById('total-terraza').innerText=t; } catch(e) {}
        }
        async function modificarMesas(z, cant) {
            if(!confirm("¿Seguro?")) return;
            try {
                if(cant>0) await getSupabase().from('mesas').insert([{ zona: z, estado_actual: 'libre' }]);
                else {
                    const { data: mz } = await getSupabase().from('mesas').select('id').eq('zona', z).eq('estado_actual', 'libre').limit(1);
                    if(mz?.length>0) await getSupabase().from('mesas').delete().eq('id', mz[0].id); else alert("Ninguna libre.");
                }
                cargarMesas();
            } catch(e) {}
        }
        async function exportarExcel() {
            try {
                const { data: r } = await getSupabase().from('reservas').select('fecha, hora_inicio, nombre_cliente, telefono_cliente, mesas(zona)');
                let c = "\uFEFFFECHA,HORA,NOMBRE,TELEFONO,ZONA\n"; r?.forEach(x => c += `${x.fecha},${x.hora_inicio},"${x.nombre_cliente}","${x.telefono_cliente}",${x.mesas?.zona||'Desc'}\n`);
                const link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(new Blob([c], { type: 'text/csv;charset=utf-8;' }))); link.setAttribute("download", "Reservas.csv");
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            } catch(e) { alert("Error exportar."); }
        }
    </script>
</body>
</html>
